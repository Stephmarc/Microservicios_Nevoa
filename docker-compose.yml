      META_DB_HOST: ${META_DB_HOST}
      META_DB_PORT: ${META_DB_PORT}
      META_DB_NAME: ${META_DB_NAME}
      META_DB_USERNAME: ${META_DB_USERNAME}
      META_DB_PASSWORD: ${META_DB_PASSWORD}
    ports:
      - "8085:8085"
    expose:
      - "8085"
    networks:
      - ms-net


  mysql-habito:
    image: mysql:8.4
    container_name: nevoa-mysql-habito
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${HABITO_MYSQL_ROOT_PASSWORD}
