    ports:
      - "8088:8088"
    expose:
      - "8088"
    networks:
      - ms-net

volumes:
  mysql_usuario_data:
  mysql_tarea_data:
  mysql_proyecto_data:
  mysql_nota_data:
  mysql_meta_data:
  mysql_habito_data:
  mysql_pomodoro_data:

networks:
  ms-net:
    external: true
    name: ms-net
