name: nevoa-distribuido

services:
  config-server:
    build: ./infra/config-server
    container_name: nevoa-config-server
    restart: unless-stopped
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo
    ports:
      - "7071:7071"
    volumes:
      - ./infra/config-repo:/config-repo:ro
    networks:
      - ms-net

  registry-server:
    build: ./infra/registry-server
    container_name: nevoa-registry-server
    restart: unless-stopped
    ports:
      - "7081:7081"
    networks:
      - ms-net

  gateway-server:
    build: ./infra/gateway-server
    container_name: nevoa-gateway-server
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_started
      registry-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-server:7081/eureka/
    ports:
      - "7091:7091"
    networks:
      - ms-net


  mysql-usuario:
    image: mysql:8.4
    container_name: nevoa-mysql-usuario
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${USUARIO_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${USUARIO_MYSQL_DATABASE}
    ports:
      - "3311:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${USUARIO_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_usuario_data:/var/lib/mysql
    networks:
      - ms-net

  usuario-service:
    build: ./services/usuario-service
    restart: unless-stopped
    depends_on:
      mysql-usuario:
        condition: service_healthy
      config-server:
        condition: service_started
      registry-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      USUARIO_DB_HOST: ${USUARIO_DB_HOST}
      USUARIO_DB_PORT: ${USUARIO_DB_PORT}
      USUARIO_DB_NAME: ${USUARIO_DB_NAME}
      USUARIO_DB_USERNAME: ${USUARIO_DB_USERNAME}
      USUARIO_DB_PASSWORD: ${USUARIO_DB_PASSWORD}
    ports:
      - "8081:8081"
    expose:
      - "8081"
    networks:
      - ms-net


  mysql-tarea:
    image: mysql:8.4
    container_name: nevoa-mysql-tarea
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TAREA_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${TAREA_MYSQL_DATABASE}
    ports:
      - "3312:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${TAREA_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_tarea_data:/var/lib/mysql
    networks:
      - ms-net

  tarea-service:
    build: ./services/tarea-service
    restart: unless-stopped
    depends_on:
      mysql-tarea:
        condition: service_healthy
      config-server:
        condition: service_started
      registry-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      TAREA_DB_HOST: ${TAREA_DB_HOST}
      TAREA_DB_PORT: ${TAREA_DB_PORT}
      TAREA_DB_NAME: ${TAREA_DB_NAME}
      TAREA_DB_USERNAME: ${TAREA_DB_USERNAME}
      TAREA_DB_PASSWORD: ${TAREA_DB_PASSWORD}
    ports:
      - "8082:8082"
    expose:
      - "8082"
    networks:
      - ms-net


  mysql-proyecto:
    image: mysql:8.4
    container_name: nevoa-mysql-proyecto
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${PROYECTO_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PROYECTO_MYSQL_DATABASE}
    ports:
      - "3313:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${PROYECTO_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_proyecto_data:/var/lib/mysql
    networks:
      - ms-net

  proyecto-service:
    build: ./services/proyecto-service
    restart: unless-stopped
    depends_on:
      mysql-proyecto:
        condition: service_healthy
      config-server:
        condition: service_started
      registry-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      PROYECTO_DB_HOST: ${PROYECTO_DB_HOST}
      PROYECTO_DB_PORT: ${PROYECTO_DB_PORT}
      PROYECTO_DB_NAME: ${PROYECTO_DB_NAME}
      PROYECTO_DB_USERNAME: ${PROYECTO_DB_USERNAME}
      PROYECTO_DB_PASSWORD: ${PROYECTO_DB_PASSWORD}
    ports:
      - "8083:8083"
    expose:
      - "8083"
    networks:
      - ms-net


  mysql-nota:
    image: mysql:8.4
    container_name: nevoa-mysql-nota
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NOTA_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NOTA_MYSQL_DATABASE}
    ports:
      - "3314:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${NOTA_MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_nota_data:/var/lib/mysql
    networks:
      - ms-net

  nota-service:
    build: ./services/nota-service
    restart: unless-stopped
    depends_on:
      mysql-nota:
        condition: service_healthy
      config-server:
        condition: service_started
      registry-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      NOTA_DB_HOST: ${NOTA_DB_HOST}
      NOTA_DB_PORT: ${NOTA_DB_PORT}
      NOTA_DB_NAME: ${NOTA_DB_NAME}
      NOTA_DB_USERNAME: ${NOTA_DB_USERNAME}
      NOTA_DB_PASSWORD: ${NOTA_DB_PASSWORD}
    ports:
      - "8084:8084"
    expose:
      - "8084"
    networks:
