global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'nevoa-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'config-server:7071'
        - 'gateway-server:7091'
        - 'registry-server:7081'
        - 'dashboard-service:8088'
        - 'habito-service:8086'
        - 'meta-service:8085'
        - 'nota-service:8084'
        - 'pomodoro-service:8087'
        - 'proyecto-service:8083'
        - 'tarea-service:8082'
        - 'usuario-service:8081'