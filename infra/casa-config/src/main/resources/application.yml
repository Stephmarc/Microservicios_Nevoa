server:
  port: 18888
spring:
  application:
    name: casa-config
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:./config-repo
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
