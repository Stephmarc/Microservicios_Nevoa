server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://casa-eureka:8761/eureka/}
springdoc:
  swagger-ui:
    enabled: false
management:
  endpoint:
    health:
      show-details: never

app:
  security:
    enabled: true
  mercadopago:
    enabled: true
    base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
    access-token: ${MERCADOPAGO_ACCESS_TOKEN}
