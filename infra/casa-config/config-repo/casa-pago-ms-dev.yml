server:
  port: 18107
spring:
  datasource:
    url: jdbc:postgresql://localhost:15440/casa_pago_db
    username: casa_pago
    password: casa_pago
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka/
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    pe.edu.upeu.casaonada: DEBUG

app:
  security:
    enabled: false
  mercadopago:
    enabled: false
    base-url: https://api.mercadopago.com
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
