server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${USUARIO_DB_HOST:mysql-usuario}:${USUARIO_DB_PORT:3306}/${USUARIO_DB_NAME:db_nevoa_usuario}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${USUARIO_DB_USERNAME:root}
    password: ${USUARIO_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://registry-server:7081/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
